# GitLab replacement for .github/workflows/portable-builds.yml.
# A branch pipeline builds Linux as a smoke test. From Build > Pipelines, run a
# manual pipeline with build_set=all (or a verified platform/group) and optionally
# publish_release=true, release_tag=v0.0.8.
spec:
  inputs:
    build_set:
      default: smoke
      options: [smoke, linux, windows-x64, windows-x86, pcvr, android, quest, switch, vita, desktop, homebrew, apple, mobile, all]
      description: Platform group to build in manual pipelines.
    release_tag:
      default: v0.0.8
      regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      description: Existing tag to attach manual release packages to.
    publish_release:
      default: 'false'
      options: ['false', 'true']
      description: Publish verified packages as a GitLab release.
---
stages:
  - build
  - release

variables:
  GIT_DEPTH: "0"
  CI_BUILD_SET: $[[ inputs.build_set ]]
  CI_RELEASE_TAG: $[[ inputs.release_tag ]]
  CI_PUBLISH_RELEASE: $[[ inputs.publish_release ]]

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "codex/gitlab-008-ci"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

.package:
  stage: build
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - release-out/
    expire_in: 90 days

windows-x64:
  extends: .package
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "desktop" || $CI_BUILD_SET == "windows-x64"'
  script:
    - '& .\tools\ci\gitlab\build-windows.ps1 -Target x64'

windows-x86:
  extends: .package
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "desktop" || $CI_BUILD_SET == "windows-x86"'
  script:
    - '& .\tools\ci\gitlab\build-windows.ps1 -Target x86'

windows-pcvr:
  extends: .package
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "desktop" || $CI_BUILD_SET == "pcvr"'
  script:
    - '& .\tools\ci\gitlab\build-windows.ps1 -Target pcvr'

# The hosted Windows image has Build Tools, but does not promise the UWP/Store
# workload or redistributable. Run this on an appropriately provisioned runner.
xbox-uwp-x64:
  extends: .package
  tags: [starfox-windows-uwp]
  rules:
    - if: '$CI_BUILD_SET == "all"'
      when: manual
      allow_failure: true
  script:
    - '& .\tools\ci\gitlab\build-windows.ps1 -Target uwp'

linux-x64:
  extends: .package
  image: ubuntu:24.04
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "desktop" || $CI_BUILD_SET == "smoke" || $CI_BUILD_SET == "linux"'
  script:
    - bash tools/ci/gitlab/build-unix.sh linux

macos-universal:
  extends: .package
  image: macos-15-xcode-16
  tags: [saas-macos-large-m2pro]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "apple"'
  script:
    - bash tools/ci/gitlab/build-apple.sh macos

ios-device:
  extends: .package
  image: macos-15-xcode-16
  tags: [saas-macos-large-m2pro]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "mobile" || $CI_BUILD_SET == "apple"'
  script:
    - bash tools/ci/gitlab/build-apple.sh ios

android-arm64:
  extends: .package
  image: eclipse-temurin:17-jdk-jammy
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "mobile" || $CI_BUILD_SET == "android"'
  script:
    - bash tools/ci/gitlab/build-android.sh android

quest-arm64:
  extends: .package
  image: eclipse-temurin:17-jdk-jammy
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "quest"'
  script:
    - bash tools/ci/gitlab/build-android.sh quest

switch-homebrew:
  extends: .package
  image:
    name: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    entrypoint: [""]
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "homebrew" || $CI_BUILD_SET == "switch"'
  script:
    - bash tools/ci/gitlab/build-unix.sh switch

vita-homebrew:
  extends: .package
  image:
    name: vitasdk/vitasdk:nightly-non-root-20260829@sha256:8c025f249ce33e3c76f92f422099bfb8b01a4e1a1f67db175df53257c2bbc28b
    entrypoint: [""]
    docker:
      user: root
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_BUILD_SET == "all" || $CI_BUILD_SET == "homebrew" || $CI_BUILD_SET == "vita"'
  script:
    - bash tools/ci/gitlab/build-unix.sh vita

publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  tags: [saas-linux-small-amd64]
  resource_group: starfox-008-release
  rules:
    - if: '$CI_PUBLISH_RELEASE == "true"'
  needs:
    - {job: windows-x64, artifacts: true, optional: true}
    - {job: windows-x86, artifacts: true, optional: true}
    - {job: windows-pcvr, artifacts: true, optional: true}
    - {job: xbox-uwp-x64, artifacts: true, optional: true}
    - {job: linux-x64, artifacts: true, optional: true}
    - {job: macos-universal, artifacts: true, optional: true}
    - {job: ios-device, artifacts: true, optional: true}
    - {job: android-arm64, artifacts: true, optional: true}
    - {job: quest-arm64, artifacts: true, optional: true}
    - {job: switch-homebrew, artifacts: true, optional: true}
    - {job: vita-homebrew, artifacts: true, optional: true}
  script:
    - bash tools/ci/gitlab/publish-release.sh
