name: Temporary native shadow producer SDK compile (no GPU, no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-shadow-producer:
    name: Whole native shadow producer and runtime shaders / ${{ matrix.sdk }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphoneos]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Compile actual producer and both complete runtime shader sources
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tools/check_producer.py --sdk '${{ matrix.sdk }}' --out '${{ runner.temp }}/producer-result'
      - name: Preserve real native compiler outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shadow-producer-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/producer-result/*.o
            ${{ runner.temp }}/producer-result/*.air
            ${{ runner.temp }}/producer-result/*.metallib
            ${{ runner.temp }}/producer-result/*.json
            ${{ runner.temp }}/producer-result/*.log
            ${{ runner.temp }}/producer-result/generated/*.hpp
            ${{ runner.temp }}/producer-result/runtime-sources/*.metal
          if-no-files-found: warn
          retention-days: 7
