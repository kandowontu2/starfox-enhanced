name: Temporary offline Apple shader build graph (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal-source-graph:
    name: Complete25 source build configuration / ${{ matrix.sdk }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphoneos]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Configure real SDK and full offline build graph
        run: python3 tools/check_source_graph.py --sdk '${{ matrix.sdk }}' --out '${{ runner.temp }}/source-graph'
      - name: Preserve actual native configuration and graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-graph-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/source-graph/*.json
            ${{ runner.temp }}/source-graph/*.log
            ${{ runner.temp }}/source-graph/build.ninja
          if-no-files-found: warn
          retention-days: 7
