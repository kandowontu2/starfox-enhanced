name: Temporary complete Metal embedding checks (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  metal-embedding:
    name: Complete25 embedding / ${{ matrix.sdk }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphoneos]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Fetch only the original complete25 public SDK shader results
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38054247676
          pattern: metal-${{ matrix.sdk }}-*
          path: ${{ runner.temp }}/sdk-artifacts
      - name: Inspect exact native embedding and all available Metal pipeline loads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/check_embedding.py --sdk '${{ matrix.sdk }}' --artifacts '${{ runner.temp }}/sdk-artifacts' --out '${{ runner.temp }}/embedding-result'
      - name: Preserve diagnostics and nonprivate native shader artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedding-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/embedding-result/*.o
            ${{ runner.temp }}/embedding-result/probe
            ${{ runner.temp }}/embedding-result/*.terminal.json
            ${{ runner.temp }}/embedding-result/*.prelaunch.json
            ${{ runner.temp }}/embedding-result/*.stdout.log
            ${{ runner.temp }}/embedding-result/*.stderr.log
            ${{ runner.temp }}/embedding-result/embedding-receipt.json
          if-no-files-found: warn
          retention-days: 7
