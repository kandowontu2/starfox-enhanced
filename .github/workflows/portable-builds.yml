name: Isolated Vulkan ordered-curved producer candidate (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shaders:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Install compiler and independent SPIR-V validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y glslc spirv-tools
      - name: Compile and validate every original ray-query variant
        run: python3 tools/ci/compile-vulkan-curved.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-curved-producer-r456
          path: ${{ runner.temp }}/vulkan-curved-r456/
          retention-days: 7
          if-no-files-found: warn
