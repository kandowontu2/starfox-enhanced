name: Portable platform builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the artifacts
        required: false
        default: ''
      quest_only:
        description: Validate only the Quest build while diagnosing its runner
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-x64:
    if: ${{ !inputs.quest_only }}
    name: Windows x64 runtime and standalone asset builder
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build/asset-builder -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTARFOX_BUILD_TESTS=OFF `
            -DSTARFOX_ENABLE_LEIASR=ON `
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF
          cmake --build build/asset-builder --target starfox_pc starfox_asset_builder
      - name: Verify standalone Windows imports
        shell: pwsh
        run: |
          $objdump = (Get-Command objdump.exe -ErrorAction Stop).Source
          foreach ($binary in @(
              'build/asset-builder/starfox_pc.exe',
              'build/asset-builder/starfox_asset_builder.exe')) {
            $imports = (& $objdump -p $binary | Out-String)
            if ($imports -match 'libgcc_s_|libstdc\+\+|libwinpthread') {
              throw "$binary still depends on a MinGW runtime DLL"
            }
          }
          & build/asset-builder/starfox_asset_builder.exe
          if ($LASTEXITCODE -ne 2) {
            throw 'asset builder did not launch and print its usage'
          }
          $global:LASTEXITCODE = 0
      - name: Prepare pinned NVIDIA DLSS runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'streamline-sdk-v2.14.1.zip'
          Invoke-WebRequest 'https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.1/streamline-sdk-v2.14.1.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '92C4D954631A1710DA86CA3FA8D5034F2B9503838C95FC4AE977AE149319781B') {
            throw 'Streamline SDK archive checksum mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'starfox-streamline-sdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $headers = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter sl_security.h)
          if ($headers.Count -ne 1) { throw 'Unexpected Streamline SDK layout' }
          $sdk = $headers[0].Directory.Parent.FullName
          "STARFOX_RELEASE_DLSS_SDK=$sdk" >> $env:GITHUB_ENV
          cmake -S tools/streamline_probe -B build/dlss-release -G 'Visual Studio 17 2022' -A x64 "-DSTREAMLINE_SDK=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'DLSS adapter configure failed' }
          cmake --build build/dlss-release --config Release --target starfox_dlss_native
          if ($LASTEXITCODE -ne 0) { throw 'DLSS adapter build failed' }
      - name: Embed verified DLSS 4.5 runtime
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'starfox-dlss-embed'
          ./tools/package_dlss.ps1 -SdkDirectory $env:STARFOX_RELEASE_DLSS_SDK `
            -Adapter build/dlss-release/Release/starfox_dlss_native.dll -Destination $staging
          cmake -S . -B build/asset-builder "-DSTARFOX_DLSS_RUNTIME_DIRECTORY=$staging/dlss"
          if ($LASTEXITCODE -ne 0) { throw 'Embedded DLSS configure failed' }
          cmake --build build/asset-builder --target starfox_pc
          if ($LASTEXITCODE -ne 0) { throw 'Embedded DLSS runtime build failed' }
      - name: Build optional direct SR Platform adapter
        shell: pwsh
        run: |
          ./tools/build_leia_sr.ps1 -BuildDirectory build/leia-sr-msvc -OutputDirectory build/asset-builder
          if ($LASTEXITCODE -ne 0) { throw 'SR Platform adapter build failed' }
          cmake --build build/asset-builder --target starfox_leia_sr_check
          if ($LASTEXITCODE -ne 0) { throw 'SR Platform checker build failed' }
          $imports = (& objdump.exe -p build/asset-builder/starfox_leia_sr.dll | Out-String)
          if ($imports -notmatch 'starfox_leia_sr_status' -or
              $imports -notmatch 'starfox_leia_sr_get_api' -or
              $imports -match 'DLL Name: (SimulatedReality|Dimenco|opencv|glog|LeapC)') {
            throw 'SR Platform diagnostic exports or optional delay-load contract invalid'
          }
          $checkerImports = (& objdump.exe -p build/asset-builder/starfox_leia_sr_check.exe | Out-String)
          if ($checkerImports -match 'libgcc_s_|libstdc\+\+|libwinpthread') {
            throw 'SR Platform checker depends on a MinGW runtime DLL'
          }
          & build/asset-builder/starfox_leia_sr_check.exe --expect-unavailable
          if ($LASTEXITCODE -ne 0) { throw 'SR adapter/owned texture checks failed' }
      - name: Package runtime and builder
        shell: pwsh
        run: |
          $runtime = 'StarFoxEnhanced-0.0.8-windows-x64'
          cmake --install build/asset-builder --prefix $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          ./tools/package_displayxr.ps1 -OutputDirectory $runtime
          ./tools/package_displayxr.ps1 -OutputDirectory $runtime -VerifyOnly
          python tests/test_displayxr_package.py --package $runtime
          if ($LASTEXITCODE -ne 0) { throw 'DisplayXR optional package regression failed' }
          if (!(Test-Path "$runtime/licenses/dlss/nvngx_dlss.license.txt")) {
            throw 'Embedded DLSS redistribution notices missing'
          }
          if (!(Test-Path "$runtime/licenses/displayxr/LICENSE.txt") -or
              !(Test-Path "$runtime/licenses/displayxr/NOTICE.txt")) {
            throw 'DisplayXR interface redistribution notices missing'
          }
          if (!(Test-Path "$runtime/starfox_leia_sr.dll") -or
              !(Test-Path "$runtime/licenses/leia-sr/SR-SDK-LICENSE.txt") -or
              !(Test-Path "$runtime/starfox_leia_sr_check.exe") -or
              !(Test-Path "$runtime/Diagnose-Leia-SR.cmd")) {
            throw 'SR Platform adapter, checker, instructions or notices missing'
          }
          Compress-Archive -Path "$runtime/*" -DestinationPath "$runtime.zip"
          $builder = 'StarFoxAssetBuilder-0.0.8-windows-x64'
          New-Item -ItemType Directory -Force $builder | Out-Null
          Copy-Item build/asset-builder/starfox_asset_builder.exe $builder/
          Copy-Item platform/mobile/ASSET_BUILDER.md $builder/README.md
          Copy-Item THIRD_PARTY_NOTICES.md $builder/
          Compress-Archive -Path "$builder/*" -DestinationPath "$builder.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-windows-x64
          path: StarFoxEnhanced-0.0.8-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxAssetBuilder-0.0.8-windows-x64
          path: StarFoxAssetBuilder-0.0.8-windows-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-windows-x64.zip \
            StarFoxAssetBuilder-0.0.8-windows-x64.zip --clobber

  windows-x86:
    if: ${{ !inputs.quest_only }}
    name: Windows x86 runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned LLVM-MinGW toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest `
            'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip' `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $root = (Get-ChildItem -LiteralPath $directory -Directory |
            Select-Object -First 1).FullName
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and install
        shell: pwsh
        run: |
          ./tools/build_windows_x86.ps1 `
            -LlvmMingwRoot $env:LLVM_MINGW_ROOT `
            -BuildDirectory build/windows-x86-release `
            -InstallDirectory dist/StarFoxEnhanced-windows-x86
      - name: Verify and package runtime
        shell: pwsh
        run: |
          $binary = 'dist/StarFoxEnhanced-windows-x86/starfox_pc.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'x86 runtime was not installed'
          }
          $readobj = Join-Path $env:LLVM_MINGW_ROOT 'bin/llvm-readobj.exe'
          $headers = & $readobj --file-headers $binary | Out-String
          if ($headers -notmatch 'IMAGE_FILE_MACHINE_I386') {
            throw 'packaged runtime is not a 32-bit x86 PE image'
          }
          $package = 'StarFoxEnhanced-0.0.8-windows-x86'
          Move-Item dist/StarFoxEnhanced-windows-x86 $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-windows-x86
          path: StarFoxEnhanced-0.0.8-windows-x86.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-windows-x86.zip --clobber

  xbox-uwp-x64:
    if: ${{ !inputs.quest_only }}
    name: Xbox UWP x64 (Developer Mode)
    # Keep the legacy UWP/C++ packaging workload and its redistributable
    # Microsoft.VCLibs framework package available. windows-latest moved to
    # VS 2026 and no longer guarantees this complete Xbox Dev Mode toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build signed Xbox Developer Mode package
        shell: pwsh
        run: |
          ./tools/build_xbox_uwp.ps1 `
            -BuildDirectory build/xbox-uwp-x64 `
            -InstallDirectory dist/StarFoxEnhanced-xbox-uwp-x64
      - name: Verify and package UWP output
        shell: pwsh
        run: |
          $root = 'dist/StarFoxEnhanced-xbox-uwp-x64'
          $package = Join-Path $root 'StarFoxEnhanced-0.0.8-xbox-uwp-x64.appx'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw 'Xbox UWP package is missing'
          }
          $allPackages = @(Get-ChildItem -LiteralPath $root -File |
            Where-Object { $_.Extension -in '.appx', '.msix', '.appxbundle', '.msixbundle' })
          if ($allPackages.Count -ne 1 -or $allPackages[0].Name -ne (Split-Path -Leaf $package)) {
            throw 'Xbox UWP output contains stale or unexpected packages'
          }
          if (-not (Test-Path -LiteralPath "$root/StarFoxEnhanced-UWP-Development.cer")) {
            throw 'Xbox UWP public development certificate is missing'
          }
          $dependencies = @(Get-ChildItem -LiteralPath "$root/Dependencies/x64" `
            -File -Filter '*.appx' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^Microsoft\.VCLibs(?:\.140\.00.*|\.x64\.14\.00)\.appx$' })
          if ($dependencies.Count -ne 1) {
            throw 'Xbox UWP VCLibs x64 dependency is missing or ambiguous'
          }
          $dependency = $dependencies[0].FullName
          $releaseRoot = 'build/xbox-uwp-release'
          $releaseDependencies = "$releaseRoot/Dependencies/x64"
          New-Item -ItemType Directory -Force $releaseDependencies | Out-Null
          Copy-Item -LiteralPath $package -Destination $releaseRoot
          Copy-Item -LiteralPath "$root/StarFoxEnhanced-UWP-Development.cer" `
            -Destination $releaseRoot
          Copy-Item -LiteralPath "$root/README-XBOX-UWP.md" -Destination $releaseRoot
          Copy-Item -LiteralPath $dependency -Destination $releaseDependencies
          Compress-Archive -Path "$releaseRoot/*" `
            -DestinationPath StarFoxEnhanced-0.0.8-xbox-uwp-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-xbox-uwp-x64
          path: StarFoxEnhanced-0.0.8-xbox-uwp-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-xbox-uwp-x64.zip --clobber

  linux-x64:
    if: ${{ !inputs.quest_only }}
    name: Linux x64 native runtime
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev \
            libudev-dev
      - name: Test Switch hardware-buffer handoff on host
        shell: bash
        run: |
          curl --fail --location \
            https://raw.githubusercontent.com/neomody77/sdl3-switch/182e511214d7600e4bdab8606d7caf0ef744afd6/sdl3-switch.patch \
            --output "$RUNNER_TEMP/sdl3-switch.patch"
          python3 tests/test_switch_audio_backend.py "$RUNNER_TEMP/sdl3-switch.patch" c++
      - name: Build, test, and install
        shell: bash
        run: |
          chmod +x tools/build_linux.sh
          tools/build_linux.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/starfox-enhanced-linux-x64" \
            "$GITHUB_WORKSPACE/dist/StarFoxEnhanced-linux-x64"
      - name: Verify and package runtime
        shell: bash
        run: |
          binary="dist/StarFoxEnhanced-linux-x64/starfox_pc"
          test -x "${binary}"
          test -x dist/StarFoxEnhanced-linux-x64/starfox_asset_builder
          file "${binary}" | grep -q 'ELF 64-bit.*x86-64'
          ! ldd "${binary}" | grep -q 'not found'
          cmake -E tar cf StarFoxEnhanced-0.0.8-linux-x64.zip \
            --format=zip dist/StarFoxEnhanced-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-linux-x64
          path: StarFoxEnhanced-0.0.8-linux-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-linux-x64.zip --clobber

  macos-universal:
    if: ${{ !inputs.quest_only }}
    name: macOS universal (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: bash
        run: |
          chmod +x tools/build_apple.sh
          tools/build_apple.sh "$GITHUB_WORKSPACE" macos
      - name: Verify and package application
        shell: bash
        run: |
          app="build/macos-universal/Release/StarFoxEnhanced.app"
          binary="${app}/Contents/MacOS/StarFoxEnhanced"
          test -d "${app}"
          test -x "${binary}"
          plutil -lint "${app}/Contents/Info.plist"
          archs="$(lipo -archs "${binary}")"
          [[ " ${archs} " == *" arm64 "* ]]
          [[ " ${archs} " == *" x86_64 "* ]]
          package="StarFoxEnhanced-0.0.8-macos-universal"
          mkdir -p "${package}"
          cp -R "${app}" "${package}/"
          cp build/macos-universal/Release/starfox_asset_builder "${package}/"
          cp platform/mobile/ASSET_BUILDER.md "${package}/ASSET_BUILDER.md"
          cp README.md CREDITS.md THIRD_PARTY_NOTICES.md "${package}/"
          ditto -c -k --sequesterRsrc --keepParent "${package}" "${package}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-macos-universal
          path: StarFoxEnhanced-0.0.8-macos-universal.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-macos-universal.zip --clobber

  ios-device:
    if: ${{ !inputs.quest_only }}
    name: iOS arm64 device (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device application
        shell: bash
        run: |
          chmod +x tools/build_apple.sh
          tools/build_apple.sh "$GITHUB_WORKSPACE" ios
      - name: Verify and package application
        shell: bash
        run: |
          app="build/ios/Release-iphoneos/StarFoxEnhanced.app"
          binary="${app}/StarFoxEnhanced"
          test -d "${app}"
          test -f "${binary}"
          plutil -lint "${app}/Info.plist"
          # SDL's iOS display link requests the device's maximum refresh rate,
          # but iPhone ProMotion stays capped at 60 Hz without this bundle key.
          plutil -convert json -o - "${app}/Info.plist" \
            | jq -e '.CADisableMinimumFrameDurationOnPhone == true' >/dev/null
          [[ " $(lipo -archs "${binary}") " == *" arm64 "* ]]
          package="StarFoxEnhanced-0.0.8-ios-arm64-unsigned"
          python3 tools/package_ios.py --app "${app}" --output "${package}.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-ios-arm64-unsigned
          path: StarFoxEnhanced-0.0.8-ios-arm64-unsigned.ipa
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8-ios-arm64-unsigned.ipa --clobber

  android-arm64:
    if: ${{ !inputs.quest_only }}
    name: Android arm64 signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-35 build-tools;35.0.0
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: 'false'
      - name: Build release-signed APK
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/starfox-release.p12"
          umask 077
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" || -z "$ANDROID_RELEASE_PASSWORD" ]]; then
            echo 'Permanent Android signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod +x tools/build_android.sh platform/android/gradlew
          tools/build_android.sh "$GITHUB_WORKSPACE" release
      - name: Verify APK payload
        shell: bash
        run: |
          apk="dist/StarFoxEnhanced-android-arm64.apk"
          test -f "${apk}"
          python3 tools/check_android_package.py "$apk" --source-root "$GITHUB_WORKSPACE"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${apk}"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${apk}" > "$RUNNER_TEMP/signing-certificate.txt"
          grep -Fqi '50bcb41f7a02c2e9bb0f68a74b1f6e14f7317fedc69d2c6fd70a165f87800fc0' "$RUNNER_TEMP/signing-certificate.txt"
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libSDL3.so'
          cp "${apk}" StarFoxEnhanced-0.0.8-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-android-arm64
          path: StarFoxEnhanced-0.0.8-android-arm64.apk
          if-no-files-found: error
      - name: Attach signed Android APK to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" StarFoxEnhanced-0.0.8-android-arm64.apk --clobber
  quest-arm64:
    name: Quest 3 arm64 signed VR development APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-35 build-tools;35.0.0
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: 'false'
      - name: Build signed Quest release variant
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/starfox-quest-release.p12"
          umask 077
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" || -z "$ANDROID_RELEASE_PASSWORD" ]]; then
            echo 'Permanent Quest signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod +x tools/build_android.sh platform/android/gradlew
          # The private runner has repeatedly disappeared during Quest native
          # compilation without a compiler diagnostic. Record its actual
          # memory/disk pressure so a failed validation run is actionable.
          (
            while true; do
              echo "--- Quest runner resources $(date -u +%FT%TZ) ---"
              free -m
              df -h "$GITHUB_WORKSPACE"
              ps -eo pid,ppid,rss,vsz,comm --sort=-rss | sed -n '1,12p'
              for stat in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
                if [[ -r "$stat" ]]; then printf '%s: ' "$stat"; tr '\n' ' ' < "$stat"; echo; fi
              done
              sleep 20
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          tools/build_android.sh "$GITHUB_WORKSPACE" release quest
      - name: Verify and package Quest APK
        shell: bash
        run: |
          apk="dist/StarFoxEnhanced-quest-arm64.apk"
          python3 tools/check_quest_package.py "$apk" --source-root .
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/quest-badging.txt"
          grep -Fq "package: name='com.starfox.enhanced.quest'" "$RUNNER_TEMP/quest-badging.txt"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/quest-certificate.txt"
          grep -Fqi '50bcb41f7a02c2e9bb0f68a74b1f6e14f7317fedc69d2c6fd70a165f87800fc0' "$RUNNER_TEMP/quest-certificate.txt"
          mkdir -p quest-package
          cp "$apk" quest-package/
          cp tools/package/QUEST-START-HERE.txt quest-package/START-HERE.txt
          cp THIRD_PARTY_NOTICES.md CREDITS.md LICENSE-XBRZ.txt quest-package/
          mkdir -p quest-package/licenses/fonts
          cp assets/fonts/README.md assets/fonts/misaki.txt quest-package/licenses/fonts/
          cd quest-package
          zip -9 -r ../StarFoxEnhanced-0.0.8-quest-arm64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-quest-arm64
          path: StarFoxEnhanced-0.0.8-quest-arm64.zip
          if-no-files-found: error
      - name: Attach signed Quest APK package to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" StarFoxEnhanced-0.0.8-quest-arm64.zip --clobber
  windows-pcvr:
    if: ${{ !inputs.quest_only }}
    name: Windows x64 OpenXR PCVR development build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package PCVR player
        shell: pwsh
        run: |
          cmake -S . -B build/pcvr -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DSTARFOX_BUILD_VR=ON `
            -DSTARFOX_BUILD_TESTS=OFF -DBUILD_TESTING=OFF `
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF
          if ($LASTEXITCODE -ne 0) { throw 'PCVR configure failed' }
          cmake --build build/pcvr --target starfox_pcvr starfox_asset_builder
          if ($LASTEXITCODE -ne 0) { throw 'PCVR build failed' }
          & build/pcvr/starfox_asset_builder.exe
          if ($LASTEXITCODE -ne 2) { throw 'PCVR asset builder did not print usage' }
          & build/pcvr/starfox_pcvr.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'PCVR executable did not start' }
          $imports = (& objdump -p build/pcvr/starfox_pcvr.exe | Out-String)
          if ($LASTEXITCODE -ne 0 -or $imports -match 'libgcc_s_|libstdc\+\+|libwinpthread|SDL3.dll|openxr_loader.dll') {
            throw 'PCVR retains an unpackaged runtime dependency'
          }
          cmake --install build/pcvr --prefix pcvr-package --component pcvr
          if ($LASTEXITCODE -ne 0) { throw 'PCVR packaging failed' }
          foreach ($file in @('starfox_pcvr.exe','starfox_asset_builder.exe',
              'BUILD-ASSETS.bat','LAUNCH-PCVR.bat','START-HERE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path pcvr-package $file))) {
              throw "PCVR package is missing $file"
            }
          }
          foreach ($private in @('Starfox-Assets.BIN','SF.SFC','SFES.SFC',
              'Starfox-MSU1.PAK')) {
            if (Test-Path -LiteralPath (Join-Path pcvr-package $private)) {
              throw "PCVR package unexpectedly contains private asset $private"
            }
          }
          Copy-Item THIRD_PARTY_NOTICES.md,CREDITS.md -Destination pcvr-package
          Compress-Archive -Path pcvr-package/* -DestinationPath StarFoxEnhanced-0.0.8-windows-pcvr.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8-windows-pcvr
          path: StarFoxEnhanced-0.0.8-windows-pcvr.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: StarFoxEnhanced-0.0.8-windows-pcvr.zip
          draft: true

