name: Temporary complete Metal compositor shaders (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Strict ${{ matrix.sdk }} / ${{ matrix.shader }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sdk: [macosx, iphoneos]
        shader: [composite_vertex, composite_fragment, composite_witness, water_guides, water_panel_guides]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify the complete original graphics source inventory
        run: python3 -B tools/compile_metal.py --sdk '${{ matrix.sdk }}' --self-test
      - name: Compile and link the complete selected shader with the original strict observer
        run: python3 -B tools/compile_metal.py --sdk '${{ matrix.sdk }}' --shader '${{ matrix.shader }}' --out '${{ runner.temp }}/metal-result'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metal-${{ matrix.sdk }}-${{ matrix.shader }}
          path: |
            ${{ runner.temp }}/metal-result/*.metallib
            ${{ runner.temp }}/metal-result/*.terminal.json
            ${{ runner.temp }}/metal-result/*.prelaunch.json
            ${{ runner.temp }}/metal-result/*.stdout.log
            ${{ runner.temp }}/metal-result/*.stderr.log
            ${{ runner.temp }}/metal-result/receipt.json
          if-no-files-found: warn
          retention-days: 7
