name: Temporary current Metal diagnostic ABI SDK check (no GPU, no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic-sdk:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Test real parameter conversion and all exact runtime sources
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          clang++ -std=c++20 -O3 -fno-fast-math -ffp-contract=off \
            -Wall -Wextra -Wconversion -Werror -I include -I tools \
            tests/native_metal_fixture_parameter_tests.cpp -o parameter-check
          ./parameter-check
          python3 tests/test_metal_shader_sources.py
      - name: Compile and link the actual corrected Metal diagnostic
        shell: bash
        run: |
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx clang++ -std=c++20 -O3 -fobjc-arc \
            -fno-fast-math -ffp-contract=off -target x86_64-apple-macos14.0 \
            -isysroot "$sdk" -I include -I tools tools/check_native_metal.mm \
            -framework Foundation -framework Metal -o native-metal-check
          test -s native-metal-check
          file native-metal-check
          nm -gU native-metal-check | grep -E '(_main$)'
          echo 'SDK compile/link only. No Metal device/runtime/performance acceptance.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-metal-diagnostic-abi-r360
          path: |
            parameter-check
            native-metal-check
          if-no-files-found: warn
          retention-days: 7
