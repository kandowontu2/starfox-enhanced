name: Temporary native material coverage and colour SDK compile (no GPU, no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-coverage:
    name: Additional material coverage and colour kernels / ${{ matrix.sdk }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphoneos]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Compile and link held component with original strict flags and native resource observer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/test_metal_material_colour.py
          python3 tools/compile_coverage.py --sdk '${{ matrix.sdk }}' --out '${{ runner.temp }}/coverage-result'
      - name: Preserve real compiler diagnostics and nonprivate component artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-material-${{ matrix.sdk }}
          path: |
            ${{ runner.temp }}/coverage-result/*.air
            ${{ runner.temp }}/coverage-result/*.metallib
            ${{ runner.temp }}/coverage-result/*.json
            ${{ runner.temp }}/coverage-result/*.log
          if-no-files-found: warn
          retention-days: 7
