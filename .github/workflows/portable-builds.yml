name: Temporary current native rendering build (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rendering:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify pinned DXC and use the runner's GCC toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_07_29.zip'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ne 'A1DFB116BA3EEAE6A1582291B53A8E7BF65AD760676BD3194685C8F7367CD241') { throw 'Pinned DXC archive differs' }
          $directory = Join-Path $env:RUNNER_TEMP 'native-dxc'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          if ((Get-FileHash -LiteralPath "$directory/bin/x64/dxc.exe").Hash -ne '980A3A4C6E5C88F5737DDE321E548860021D58FA2349790D4E572805CB298293' -or
              (Get-FileHash -LiteralPath "$directory/bin/x64/dxcompiler.dll").Hash -ne '9A5100511E127C6A2FC78EDF984F95074A76D35B90C90C4D342430A5AE160E9B') { throw 'Pinned DXC executable/library differs' }
          if (!(Test-Path -LiteralPath 'C:/Strawberry/c/bin/g++.exe')) { throw 'Runner GCC missing; do not silently switch compiler families' }
          'C:/Strawberry/c/bin' | Out-File -LiteralPath $env:GITHUB_PATH -Append
      - name: Test exact shader-payload serialization
        shell: pwsh
        run: |
          python ./tools/ci/test-external-dxr-payloads.py
          if ($LASTEXITCODE -ne 0) { throw 'Payload serialization controls failed' }
      - name: Test owned compiler identity with PID reuse controls
        shell: pwsh
        run: |
          & ./tools/ci/test-owned-compiler-resources.ps1 -Receipt "$env:RUNNER_TEMP/compiler-identity-controls.json"
      - name: Build the complete current CMake rendering target with bounded single-worker compilation
        shell: pwsh
        run: |
          & ./tools/ci/build-current-native.ps1 -Dxc "$env:RUNNER_TEMP/native-dxc/bin/x64/dxc.exe" -Output "$env:RUNNER_TEMP/native-result"
      - name: Preserve only the diagnostic and its nonprivate build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-native-rendering-r420
          path: |
            ${{ runner.temp }}/native-result/*
            ${{ runner.temp }}/compiler-identity-controls.json
          if-no-files-found: error
          retention-days: 7
