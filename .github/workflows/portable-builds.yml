name: Portable platform builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to receive the artifacts
        required: false
        default: ''
      quest_only:
        description: Validate only the Quest build while diagnosing its runner
        type: boolean
        required: false
        default: false
      windows_x64_only:
        description: Retry Windows x64 packaging only; leave the release draft for inventory verification
        type: boolean
        required: false
        default: false
      source_checks_only:
        description: Run desktop and shared VR source tests only; no platform packages or release
        type: boolean
        required: false
        default: false
      source_check_os:
        description: Select source checks without rebuilding or releasing other platforms
        type: choice
        options: [both, windows, linux, macos, vita-package]
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  updater-checks:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only }}
    uses: ./.github/workflows/updater-checks.yml

  source-checks:
    if: ${{ inputs.source_checks_only && inputs.source_check_os != 'vita-package' && inputs.source_check_os != 'macos' }}
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.source_check_os == 'windows' && '["windows-2022"]' || inputs.source_check_os == 'linux' && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libasound2-dev libudev-dev libgl1-mesa-dev
      - name: Configure source-only desktop and shared VR graph
        shell: bash
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          compiler=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            toolchain_dir="${MSYS2_ROOT//\\//}/ucrt64/bin"
            compiler=("-DCMAKE_C_COMPILER=$toolchain_dir/gcc.exe" "-DCMAKE_CXX_COMPILER=$toolchain_dir/g++.exe" "-DCMAKE_MAKE_PROGRAM=$toolchain_dir/ninja.exe")
            export PATH="$(cygpath -u "$toolchain_dir"):$PATH"
            echo "$toolchain_dir" >> "$GITHUB_PATH"
          fi
          cmake -S . -B build/source-checks -G Ninja "${compiler[@]}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DSTARFOX_BUILD_TESTS=ON \
            -DSTARFOX_BUILD_RUNTIME=ON -DSTARFOX_BUILD_VR=ON \
            -DSTARFOX_ENABLE_LEIASR=OFF -DSTARFOX_EMBED_RUNTIME_ASSETS=OFF \
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF -DSTARFOX_EMBED_MSU1_MUSIC=OFF \
            -DSTARFOX_ROM_FILE=source-only-no-rom.sfc \
            -DSTARFOX_EX_ROM_FILE=source-only-no-ex-rom.sfc \
            -DSTARFOX_RETAIL_V12_FILE=source-only-no-retail.sfc
      - name: Build desktop and VR targets
        run: cmake --build build/source-checks --parallel 2
      - name: Run source regression tests
        # SDL fixtures select their own dummy drivers. Global driver environment
        # variables override their SDL_SetHint calls and make setup fail.
        # Hardware/debug-layer tests run separately on an actual GPU, not on
        # these headless source-only runners. Their targets are still built.
        run: ctest --test-dir build/source-checks --output-on-failure --parallel 2 --exclude-regex starfox_3ds --label-exclude native_gpu
      - name: Exercise safe Windows updater in an asset-free sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STARFOX_UPDATE_TEST_FIXTURE: build/source-checks/starfox_update_exit_fixture.exe
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if (!(Test-Path -LiteralPath $env:STARFOX_UPDATE_TEST_FIXTURE)) { throw 'Update restart fixture missing' }
          python tests/test_app_update.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Updater safety tests failed' }
      - name: Preserve compact test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-check-results-${{ matrix.os }}
          path: build/source-checks/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  macos-source-check:
    if: ${{ inputs.source_checks_only && inputs.source_check_os == 'macos' }}
    name: macOS source-only Metal preparation check
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Check exact ARC and dispatch preparation before the full build
        shell: bash
        run: |
          mkdir -p build/metal-preparation
          xcrun clang++ -std=c++20 -fobjc-arc -Iinclude -Isrc/render \
            tests/metal_pipeline_preparation_tests.mm -framework Metal -framework Foundation \
            -o build/metal-preparation/check
          build/metal-preparation/check
      - name: Configure real universal Apple runtime without private assets
        shell: bash
        run: |
          cmake -S . -B build/source-checks -G Xcode \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DSTARFOX_BUILD_TESTS=ON -DSTARFOX_BUILD_RUNTIME=ON -DSTARFOX_BUILD_VR=OFF \
            -DSTARFOX_ENABLE_LEIASR=OFF -DSTARFOX_EMBED_RUNTIME_ASSETS=OFF \
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF -DSTARFOX_EMBED_MSU1_MUSIC=OFF \
            -DSTARFOX_ROM_FILE=source-only-no-rom.sfc \
            -DSTARFOX_EX_ROM_FILE=source-only-no-ex-rom.sfc \
            -DSTARFOX_RETAIL_V12_FILE=source-only-no-retail.sfc
      - name: Compile actual runtime and preparation regressions
        run: >-
          cmake --build build/source-checks --config Release --parallel 2 --target
          starfox_pc starfox_metal_pipeline_preparation_tests
          starfox_responsive_preparation_tests starfox_gpu_preparation_tests
          starfox_sdl_gpu_preparation_check starfox_update_tests
      - name: Test ARC lifetime, async publication and event preparation
        run: |
          ctest --test-dir build/source-checks -C Release --output-on-failure \
            -R '^starfox_(metal_pipeline_preparation|responsive_preparation|gpu_preparation|update)_tests$'
          python3 tests/test_metal_shader_sources.py
      - name: Preserve compact results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-metal-preparation-source-check-results
          path: build/source-checks/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
      # No ROM/BIN, executable/package artifact, release or 3DS job is published.

  vita-package-check:
    if: ${{ inputs.source_checks_only && inputs.source_check_os == 'vita-package' }}
    name: Vita source-only package check
    runs-on: ubuntu-latest
    container:
      options: --user 0:0
      image: vitasdk/vitasdk:nightly-non-root-20260829@sha256:8c025f249ce33e3c76f92f422099bfb8b01a4e1a1f67db175df53257c2bbc28b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Run asset-free metadata/artwork regressions
        run: python3 tests/test_vita_package.py
      - name: Cross-compile SDK probe through the real packaging helper
        shell: bash
        run: |
          cmake -S tests/fixtures/vita_package -B "build/validation/active/vita fixture" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/validation/active/vita fixture" --target StarFoxEnhanced.vpk-vpk
          "$VITASDK/bin/arm-vita-eabi-readelf" -h "build/validation/active/vita fixture/vita_package_fixture" | grep -q 'Machine:.*ARM'
          python3 tools/check_vita_package.py "build/validation/active/vita fixture/StarFoxEnhanced.vpk"
      - name: Cross-compile actual Vita runtime and inspect its reservations
        shell: bash
        run: |
          cmake -S . -B build/vita-source-checks -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-fstack-usage \
            -DSTARFOX_BUILD_TESTS=OFF -DSTARFOX_BUILD_TOOLS=OFF \
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF \
            -DSTARFOX_ROM_FILE=source-only-no-rom.sfc \
            -DSTARFOX_EX_ROM_FILE=source-only-no-ex-rom.sfc \
            -DSTARFOX_RETAIL_V12_FILE=source-only-no-retail.sfc
          cmake --build build/vita-source-checks --parallel 2 --target StarFoxEnhanced.vpk-vpk
          "$VITASDK/bin/arm-vita-eabi-size" build/vita-source-checks/starfox_pc
          "$VITASDK/bin/arm-vita-eabi-nm" build/vita-source-checks/starfox_pc | grep -E '(_newlib_heap_size_user|sceUserMainThreadStackSize)$'
          find build/vita-source-checks -name '*.su' -exec grep -H -E '(main\(|SDL_main)' {} + || true
          python3 tools/check_vita_package.py build/vita-source-checks/StarFoxEnhanced.vpk --require-backdrops
      # Only public source/resources: no ROM/BIN, executable artifacts or release is uploaded.

  windows-x64:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only }}
    name: Windows x64 runtime and standalone asset builder
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Check release shader registration
        shell: pwsh
        run: |
          python tools/check_release_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed' }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            python tools/check_release_version.py --tag "$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'Release tag and version differ' }
          }
          cmake "-DSOURCE_DIR=$PWD" -P tests/test_release_shader_gating.cmake
          if ($LASTEXITCODE -ne 0) { throw 'Experimental shader release gating failed' }
      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build/asset-builder -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTARFOX_BUILD_TESTS=OFF `
            -DSTARFOX_ENABLE_LEIASR=ON `
            "-DSTARFOX_DLSS_RUNTIME_DIRECTORY:PATH=" `
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF
          cmake --build build/asset-builder --target starfox_pc starfox_asset_builder
      - name: Verify standalone Windows imports
        shell: pwsh
        run: |
          $objdump = (Get-Command objdump.exe -ErrorAction Stop).Source
          foreach ($binary in @(
              'build/asset-builder/starfox_pc.exe',
              'build/asset-builder/starfox_asset_builder.exe')) {
            $imports = (& $objdump -p $binary | Out-String)
            if ($imports -match 'libgcc_s_|libstdc\+\+|libwinpthread') {
              throw "$binary still depends on a MinGW runtime DLL"
            }
          }
          & build/asset-builder/starfox_asset_builder.exe
          if ($LASTEXITCODE -ne 2) {
            throw 'asset builder did not launch and print its usage'
          }
          $global:LASTEXITCODE = 0
      - name: Prepare pinned NVIDIA DLSS runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'streamline-sdk-v2.14.1.zip'
          Invoke-WebRequest 'https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.1/streamline-sdk-v2.14.1.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '92C4D954631A1710DA86CA3FA8D5034F2B9503838C95FC4AE977AE149319781B') {
            throw 'Streamline SDK archive checksum mismatch'
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'starfox-streamline-sdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $headers = @(Get-ChildItem -LiteralPath $expanded -Recurse -Filter sl_security.h)
          if ($headers.Count -ne 1) { throw 'Unexpected Streamline SDK layout' }
          $sdk = $headers[0].Directory.Parent.FullName
          "STARFOX_RELEASE_DLSS_SDK=$sdk" >> $env:GITHUB_ENV
          cmake -S tools/streamline_probe -B build/dlss-release -G 'Visual Studio 17 2022' -A x64 "-DSTREAMLINE_SDK=$sdk"
          if ($LASTEXITCODE -ne 0) { throw 'DLSS adapter configure failed' }
          cmake --build build/dlss-release --config Release --target starfox_dlss_native
          if ($LASTEXITCODE -ne 0) { throw 'DLSS adapter build failed' }
      - name: Package optional DLSS and DLSS 4.5 add-on
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'starfox-dlss-addon'
          # This helper uses cmdlets and throws on validation errors. A fresh
          # PowerShell session otherwise leaves LASTEXITCODE null on success.
          $global:LASTEXITCODE = 0
          ./tools/package_dlss.ps1 -SdkDirectory $env:STARFOX_RELEASE_DLSS_SDK `
            -Adapter build/dlss-release/Release/starfox_dlss_native.dll -Destination $staging
          if ($LASTEXITCODE -ne 0) { throw 'DLSS add-on packaging failed' }
          Copy-Item tools/package/DLSS-ADDON.txt "$staging/INSTALL-DLSS.txt"
          Compress-Archive -Path "$staging/*" -DestinationPath 'StarFoxEnhanced-0.0.8.8.3-dlss-windows-x64.zip'
      - name: Build optional direct SR Platform adapter
        shell: pwsh
        run: |
          ./tools/build_leia_sr.ps1 -BuildDirectory build/leia-sr-msvc -OutputDirectory build/asset-builder
          if ($LASTEXITCODE -ne 0) { throw 'SR Platform adapter build failed' }
          cmake --build build/asset-builder --target starfox_leia_sr_check
          if ($LASTEXITCODE -ne 0) { throw 'SR Platform checker build failed' }
          $imports = (& objdump.exe -p build/asset-builder/starfox_leia_sr.dll | Out-String)
          if ($imports -notmatch 'starfox_leia_sr_status' -or
              $imports -notmatch 'starfox_leia_sr_get_api' -or
              $imports -match 'DLL Name: (SimulatedReality|Dimenco|opencv|glog|LeapC)') {
            throw 'SR Platform diagnostic exports or optional delay-load contract invalid'
          }
          $checkerImports = (& objdump.exe -p build/asset-builder/starfox_leia_sr_check.exe | Out-String)
          if ($checkerImports -match 'libgcc_s_|libstdc\+\+|libwinpthread') {
            throw 'SR Platform checker depends on a MinGW runtime DLL'
          }
          & build/asset-builder/starfox_leia_sr_check.exe --expect-unavailable
          if ($LASTEXITCODE -ne 0) { throw 'SR adapter/owned texture checks failed' }
      - name: Package runtime and builder
        shell: pwsh
        run: |
          $runtime = 'StarFoxEnhanced-0.0.8.8.3-windows-x64'
          cmake --install build/asset-builder --prefix $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime install failed' }
          ./tools/package_displayxr.ps1 -OutputDirectory $runtime
          ./tools/package_displayxr.ps1 -OutputDirectory $runtime -VerifyOnly
          python tests/test_displayxr_package.py --package $runtime
          if ($LASTEXITCODE -ne 0) { throw 'DisplayXR optional package regression failed' }
          if (Test-Path "$runtime/dlss") {
            throw 'DLSS binaries must stay in the optional add-on, not the game ZIP'
          }
          if (!(Test-Path "$runtime/licenses/displayxr/LICENSE.txt") -or
              !(Test-Path "$runtime/licenses/displayxr/NOTICE.txt")) {
            throw 'DisplayXR interface redistribution notices missing'
          }
          if (!(Test-Path "$runtime/starfox_leia_sr.dll") -or
              !(Test-Path "$runtime/licenses/leia-sr/SR-SDK-LICENSE.txt") -or
              !(Test-Path "$runtime/starfox_leia_sr_check.exe") -or
              !(Test-Path "$runtime/Diagnose-Leia-SR.cmd")) {
            throw 'SR Platform adapter, checker, instructions or notices missing'
          }
          $builder = 'StarFoxAssetBuilder-0.0.8.8.3-windows-x64'
          New-Item -ItemType Directory -Force $builder | Out-Null
          # The game imports retail ROMs itself. Keep the optional conversion
          # tool in its own download, not duplicated in every player ZIP.
          Move-Item -LiteralPath "$runtime/starfox_asset_builder.exe" -Destination "$builder/starfox_asset_builder.exe"
          Copy-Item platform/mobile/ASSET_BUILDER.md $builder/README.md
          Copy-Item THIRD_PARTY_NOTICES.md $builder/
          Compress-Archive -Path "$runtime/*" -DestinationPath "$runtime.zip"
          Compress-Archive -Path "$builder/*" -DestinationPath "$builder.zip"
      - name: Scan exact Windows executables and final release archives
        shell: pwsh
        timeout-minutes: 10
        run: |
          # GitHub's disposable Windows image disables Defender by default.
          # Enable protection here only, never on a developer/player machine.
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Defender provisioning is restricted to GitHub-hosted runners'
          }
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows Advanced Threat Protection'
          if (Test-Path -LiteralPath $policy) {
            Set-ItemProperty -LiteralPath $policy -Name ForceDefenderPassiveMode -Value 0 -Type DWord
          }
          Start-Service WinDefend
          Set-MpPreference -DisableRealtimeMonitoring $false -DisableArchiveScanning $false `
            -DisableBehaviorMonitoring $false -DisableIOAVProtection $false -DisableScriptScanning $false
          # Enabling the service can trigger an engine restart. Retry only
          # signature initialization, never a detection or failed file scan.
          for ($updateAttempt = 0; $updateAttempt -lt 4; $updateAttempt++) {
            try { Update-MpSignature -UpdateSource MMPC -ErrorAction Stop; break }
            catch {
              if ($updateAttempt -eq 3) { throw }
              Write-Output 'Waiting for Defender signature service to initialize'
              Start-Sleep -Seconds 15
              Start-Service WinDefend
            }
          }
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $health = Get-MpComputerStatus
            if ($health.AMServiceEnabled -and $health.AntivirusEnabled -and $health.RealTimeProtectionEnabled) { break }
            Start-Sleep -Seconds 1
          }
          $health | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AMRunningMode
          ./tests/test_windows_defender.ps1
          ./tools/check_windows_defender.ps1 -UpdateSignatures `
            -Files @('StarFoxEnhanced-0.0.8.8.3-windows-x64/starfox_pc.exe',
              'StarFoxEnhanced-0.0.8.8.3-windows-x64/starfox_leia_sr.dll',
              'StarFoxEnhanced-0.0.8.8.3-windows-x64/starfox_leia_sr_check.exe',
              'StarFoxAssetBuilder-0.0.8.8.3-windows-x64/starfox_asset_builder.exe',
              'StarFoxEnhanced-0.0.8.8.3-windows-x64.zip',
              'StarFoxAssetBuilder-0.0.8.8.3-windows-x64.zip',
              'StarFoxEnhanced-0.0.8.8.3-dlss-windows-x64.zip') `
            -ReportPath build/validation/active/windows-defender-release.json
      - name: Preserve Windows scan receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-defender-scan
          path: build/validation/active/windows-defender-release.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-windows-x64
          path: StarFoxEnhanced-0.0.8.8.3-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxAssetBuilder-0.0.8.8.3-windows-x64
          path: StarFoxAssetBuilder-0.0.8.8.3-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-dlss-windows-x64
          path: StarFoxEnhanced-0.0.8.8.3-dlss-windows-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8.8.3-windows-x64.zip \
            StarFoxAssetBuilder-0.0.8.8.3-windows-x64.zip \
            StarFoxEnhanced-0.0.8.8.3-dlss-windows-x64.zip --clobber

  windows-x86:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only && !inputs.windows_x64_only }}
    name: Windows x86 runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install pinned LLVM-MinGW toolchain
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest `
            'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip' `
            -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $root = (Get-ChildItem -LiteralPath $directory -Directory |
            Select-Object -First 1).FullName
          "LLVM_MINGW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and install
        shell: pwsh
        run: |
          ./tools/build_windows_x86.ps1 `
            -LlvmMingwRoot $env:LLVM_MINGW_ROOT `
            -BuildDirectory build/windows-x86-release `
            -InstallDirectory dist/StarFoxEnhanced-windows-x86
      - name: Verify and package runtime
        shell: pwsh
        run: |
          $binary = 'dist/StarFoxEnhanced-windows-x86/starfox_pc.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw 'x86 runtime was not installed'
          }
          $readobj = Join-Path $env:LLVM_MINGW_ROOT 'bin/llvm-readobj.exe'
          $headers = & $readobj --file-headers $binary | Out-String
          if ($headers -notmatch 'IMAGE_FILE_MACHINE_I386') {
            throw 'packaged runtime is not a 32-bit x86 PE image'
          }
          $package = 'StarFoxEnhanced-0.0.8.8.3-windows-x86'
          Move-Item dist/StarFoxEnhanced-windows-x86 $package
          Compress-Archive -Path "$package/*" -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-windows-x86
          path: StarFoxEnhanced-0.0.8.8.3-windows-x86.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8.8.3-windows-x86.zip --clobber

  xbox-uwp-x64:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only && !inputs.windows_x64_only }}
    name: Xbox UWP x64 (Developer Mode)
    # Keep the legacy UWP/C++ packaging workload and its redistributable
    # Microsoft.VCLibs framework package available. windows-latest moved to
    # VS 2026 and no longer guarantees this complete Xbox Dev Mode toolchain.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: microsoft/setup-msbuild@v2
      - name: Build signed Xbox Developer Mode package
        shell: pwsh
        run: |
          ./tools/build_xbox_uwp.ps1 `
            -BuildDirectory build/xbox-uwp-x64 `
            -InstallDirectory dist/StarFoxEnhanced-xbox-uwp-x64
      - name: Verify and package UWP output
        shell: pwsh
        run: |
          $root = 'dist/StarFoxEnhanced-xbox-uwp-x64'
          $package = Join-Path $root 'StarFoxEnhanced-0.0.8.8.3-xbox-uwp-x64.appx'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
            throw 'Xbox UWP package is missing'
          }
          $allPackages = @(Get-ChildItem -LiteralPath $root -File |
            Where-Object { $_.Extension -in '.appx', '.msix', '.appxbundle', '.msixbundle' })
          if ($allPackages.Count -ne 1 -or $allPackages[0].Name -ne (Split-Path -Leaf $package)) {
            throw 'Xbox UWP output contains stale or unexpected packages'
          }
          if (-not (Test-Path -LiteralPath "$root/StarFoxEnhanced-UWP-Development.cer")) {
            throw 'Xbox UWP public development certificate is missing'
          }
          $dependencies = @(Get-ChildItem -LiteralPath "$root/Dependencies/x64" `
            -File -Filter '*.appx' -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^Microsoft\.VCLibs(?:\.140\.00.*|\.x64\.14\.00)\.appx$' })
          if ($dependencies.Count -ne 1) {
            throw 'Xbox UWP VCLibs x64 dependency is missing or ambiguous'
          }
          $dependency = $dependencies[0].FullName
          $releaseRoot = 'build/xbox-uwp-release'
          $releaseDependencies = "$releaseRoot/Dependencies/x64"
          New-Item -ItemType Directory -Force $releaseDependencies | Out-Null
          Copy-Item -LiteralPath $package -Destination $releaseRoot
          Copy-Item -LiteralPath "$root/StarFoxEnhanced-UWP-Development.cer" `
            -Destination $releaseRoot
          Copy-Item -LiteralPath "$root/README-XBOX-UWP.md" -Destination $releaseRoot
          Copy-Item -LiteralPath $dependency -Destination $releaseDependencies
          Compress-Archive -Path "$releaseRoot/*" `
            -DestinationPath StarFoxEnhanced-0.0.8.8.3-xbox-uwp-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-xbox-uwp-x64
          path: StarFoxEnhanced-0.0.8.8.3-xbox-uwp-x64.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" \
            StarFoxEnhanced-0.0.8.8.3-xbox-uwp-x64.zip --clobber

