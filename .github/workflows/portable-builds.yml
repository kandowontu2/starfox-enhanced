  android-arm64:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only && !inputs.windows_x64_only }}
    name: Android arm64 signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-35 build-tools;35.0.0
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: 'false'
      - name: Build release-signed APK
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/starfox-release.p12"
          umask 077
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" || -z "$ANDROID_RELEASE_PASSWORD" ]]; then
            echo 'Permanent Android signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod +x tools/build_android.sh platform/android/gradlew
          tools/build_android.sh "$GITHUB_WORKSPACE" release
      - name: Verify APK payload
        shell: bash
        run: |
          apk="dist/StarFoxEnhanced-android-arm64.apk"
          test -f "${apk}"
          python3 tools/check_android_package.py "$apk" --source-root "$GITHUB_WORKSPACE"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${apk}"
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "${apk}" \
            | grep -F "versionCode='21' versionName='0.0.8.8.3'"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "${apk}" > "$RUNNER_TEMP/signing-certificate.txt"
          grep -Fqi '50bcb41f7a02c2e9bb0f68a74b1f6e14f7317fedc69d2c6fd70a165f87800fc0' "$RUNNER_TEMP/signing-certificate.txt"
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libmain.so'
          unzip -l "${apk}" | grep -q 'lib/arm64-v8a/libSDL3.so'
          cp "${apk}" StarFoxEnhanced-0.0.8.8.3-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-android-arm64
          path: StarFoxEnhanced-0.0.8.8.3-android-arm64.apk
          if-no-files-found: error
      - name: Attach signed Android APK to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" StarFoxEnhanced-0.0.8.8.3-android-arm64.apk --clobber
  quest-arm64:
    if: ${{ !inputs.source_checks_only && !inputs.windows_x64_only }}
    name: Quest 3 arm64 signed VR development APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools platforms;android-35 build-tools;35.0.0
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: 'false'
      - name: Build signed Quest release variant
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/starfox-quest-release.p12"
          umask 077
          if [[ -z "$ANDROID_RELEASE_KEYSTORE" || -z "$ANDROID_RELEASE_PASSWORD" ]]; then
            echo 'Permanent Quest signing secrets are missing' >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod +x tools/build_android.sh platform/android/gradlew
          # The private runner has repeatedly disappeared during Quest native
          # compilation without a compiler diagnostic. Record its actual
          # memory/disk pressure so a failed validation run is actionable.
          (
            while true; do
              echo "--- Quest runner resources $(date -u +%FT%TZ) ---"
              free -m
              df -h "$GITHUB_WORKSPACE"
              ps -eo pid,ppid,rss,vsz,comm --sort=-rss | sed -n '1,12p'
              for stat in /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.events; do
                if [[ -r "$stat" ]]; then printf '%s: ' "$stat"; tr '\n' ' ' < "$stat"; echo; fi
              done
              sleep 20
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          tools/build_android.sh "$GITHUB_WORKSPACE" release quest
      - name: Verify and package Quest APK
        shell: bash
        run: |
          apk="dist/StarFoxEnhanced-quest-arm64.apk"
          python3 tools/check_quest_package.py "$apk" --source-root .
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/quest-badging.txt"
          grep -Fq "package: name='com.starfox.enhanced.quest'" "$RUNNER_TEMP/quest-badging.txt"
          grep -Fq "versionCode='21' versionName='0.0.8.8.3'" "$RUNNER_TEMP/quest-badging.txt"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/quest-certificate.txt"
          grep -Fqi '50bcb41f7a02c2e9bb0f68a74b1f6e14f7317fedc69d2c6fd70a165f87800fc0' "$RUNNER_TEMP/quest-certificate.txt"
          mkdir -p quest-package
          cp "$apk" quest-package/
          cp tools/package/QUEST-START-HERE.txt quest-package/START-HERE.txt
          cp THIRD_PARTY_NOTICES.md CREDITS.md LICENSE-XBRZ.txt quest-package/
          mkdir -p quest-package/licenses/fonts
          cp assets/fonts/README.md assets/fonts/misaki.txt quest-package/licenses/fonts/
          cd quest-package
          zip -9 -r ../StarFoxEnhanced-0.0.8.8.3-quest-arm64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-quest-arm64
          path: StarFoxEnhanced-0.0.8.8.3-quest-arm64.zip
          if-no-files-found: error
      - name: Attach signed Quest APK package to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          gh release upload "${tag}" StarFoxEnhanced-0.0.8.8.3-quest-arm64.zip --clobber
  windows-pcvr:
    if: ${{ !inputs.quest_only && !inputs.source_checks_only && !inputs.windows_x64_only }}
    name: Windows x64 OpenXR PCVR development build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Build and package PCVR player
        shell: pwsh
        run: |
          cmake -S . -B build/pcvr -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DSTARFOX_BUILD_VR=ON `
            -DSTARFOX_BUILD_TESTS=OFF -DBUILD_TESTING=OFF `
            -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF
          if ($LASTEXITCODE -ne 0) { throw 'PCVR configure failed' }
          cmake --build build/pcvr --target starfox_pcvr starfox_asset_builder
          if ($LASTEXITCODE -ne 0) { throw 'PCVR build failed' }
          & build/pcvr/starfox_asset_builder.exe
          if ($LASTEXITCODE -ne 2) { throw 'PCVR asset builder did not print usage' }
          & build/pcvr/starfox_pcvr.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'PCVR executable did not start' }
          $imports = (& objdump -p build/pcvr/starfox_pcvr.exe | Out-String)
          if ($LASTEXITCODE -ne 0 -or $imports -match 'libgcc_s_|libstdc\+\+|libwinpthread|SDL3.dll|openxr_loader.dll') {
            throw 'PCVR retains an unpackaged runtime dependency'
          }
          cmake --install build/pcvr --prefix pcvr-package --component pcvr
          if ($LASTEXITCODE -ne 0) { throw 'PCVR packaging failed' }
          foreach ($file in @('starfox_pcvr.exe','starfox_asset_builder.exe',
              'BUILD-ASSETS.bat','LAUNCH-PCVR.bat','START-HERE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path pcvr-package $file))) {
              throw "PCVR package is missing $file"
            }
          }
          foreach ($private in @('Starfox-Assets.BIN','SF.SFC','SFES.SFC',
              'Starfox-MSU1.PAK')) {
            if (Test-Path -LiteralPath (Join-Path pcvr-package $private)) {
              throw "PCVR package unexpectedly contains private asset $private"
            }
          }
          Copy-Item THIRD_PARTY_NOTICES.md,CREDITS.md -Destination pcvr-package
          Compress-Archive -Path pcvr-package/* -DestinationPath StarFoxEnhanced-0.0.8.8.3-windows-pcvr.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StarFoxEnhanced-0.0.8.8.3-windows-pcvr
          path: StarFoxEnhanced-0.0.8.8.3-windows-pcvr.zip
          if-no-files-found: error
      - name: Add to GitHub release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: StarFoxEnhanced-0.0.8.8.3-windows-pcvr.zip
          draft: true

