name: Isolated checked reflection endpoint candidate (no release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        format: [dxil, spirv]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Download exact previously qualified DXC
        shell: pwsh
        run: |
          $endpointArchive = Join-Path $env:RUNNER_TEMP 'dxc.zip'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2607/dxc_2026_07_29.zip' -OutFile $endpointArchive
          if ((Get-FileHash -LiteralPath $endpointArchive).Hash -ne 'A1DFB116BA3EEAE6A1582291B53A8E7BF65AD760676BD3194685C8F7367CD241') { throw 'Compiler archive mismatch' }
          Expand-Archive -LiteralPath $endpointArchive -DestinationPath "$env:RUNNER_TEMP/endpoint-dxc"
      - name: Compile bounded normal-endpoint arithmetic candidate
        shell: pwsh
        run: |
          & tools/ci/compile_endpoint.ps1 -Compiler "$env:RUNNER_TEMP/endpoint-dxc/bin/x64/dxc.exe" -Format '${{ matrix.format }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-endpoints-${{ matrix.format }}
          path: ${{ runner.temp }}/endpoint-${{ matrix.format }}/
          retention-days: 7
          if-no-files-found: warn

