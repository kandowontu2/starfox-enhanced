name: Updater checks
on:
  pull_request:
    paths:
      - '.github/workflows/updater-checks.yml'
      - 'CMakeLists.txt'
      - 'cmake/UpdateService.cmake'
      - 'src/app/update*'
      - 'include/starfox/app/update*'
      - 'tools/package/apply-update*'
      - 'tests/*update*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-updater:
    name: Native updater (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Configure asset-free updater targets
        run: >-
          cmake -S . -B build/update-checks -DCMAKE_BUILD_TYPE=Release
          -DSTARFOX_BUILD_RUNTIME=ON -DSTARFOX_BUILD_TESTS=ON
          -DSTARFOX_BUILD_TOOLS=OFF -DSTARFOX_BUILD_VR=OFF
          -DSTARFOX_ENABLE_DISPLAYXR=OFF -DSTARFOX_ENABLE_LEIASR=OFF
          -DSTARFOX_ENABLE_XBRZ=OFF -DSTARFOX_EMBED_RUNTIME_ASSETS=OFF
          -DSTARFOX_PACKAGE_MSU1_MUSIC=OFF -DSTARFOX_EMBED_MSU1_MUSIC=OFF
          -DSTARFOX_ROM_FILE=source-only-no-rom.sfc
          -DSTARFOX_EX_ROM_FILE=source-only-no-ex-rom.sfc
          -DSTARFOX_RETAIL_V12_FILE=source-only-no-retail.sfc
      - name: Build actual updater service and policy tests
        run: cmake --build build/update-checks --config Release --parallel 2 --target starfox_update_tests
      - name: Run native policy and idle-service tests
        run: ctest --test-dir build/update-checks -C Release --output-on-failure -R '^starfox_update_tests$'
      - name: Build tiny restart fixture
        if: runner.os != 'macOS'
        run: cmake --build build/update-checks --config Release --parallel 2 --target starfox_update_exit_fixture
      - name: Windows preservation, rejection and restart/rollback sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STARFOX_UPDATE_TEST_FIXTURE: build/update-checks/Release/starfox_update_exit_fixture.exe
        run: |
          if (!(Test-Path -LiteralPath $env:STARFOX_UPDATE_TEST_FIXTURE)) { throw 'Missing restart fixture' }
          python tests/test_app_update.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows updater sandbox failed' }
          python tests/test_linux_app_update.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Linux ZIP policy tests failed' }
      - name: Native Linux preservation, permissions and restart/rollback sandbox
        if: runner.os == 'Linux'
        env:
          STARFOX_UPDATE_TEST_FIXTURE: build/update-checks/starfox_update_exit_fixture
        run: python3 tests/test_linux_app_update.py -v
